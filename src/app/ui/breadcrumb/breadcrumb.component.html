<!-- add breadcrumb through routing -->
<span *ngIf="!reviewPageUrl">
  <ul>
    <img
      src="/assets/icon/home.svg"
      class="mx-2 cursor-pointer"
      (click)="redirectHome()"
    />
    <!-- <img src="/assets/icon/right-arrow.svg" class="mx-2" /> -->
    <li *ngFor="let breadcrumb of breadcrumbs$ | async">
      <img src="/assets/icon/right-arrow.svg" class="mx-2" />
      <a [routerLink]="breadcrumb.url" class="breadcrumb-title">{{
        breadcrumb.label
      }}</a>
    </li>
  </ul>
  <!-- <ul class="ab"></ul> -->
  <!-- </div> -->
  <!-- <br /> -->
  <!-- <mat-progress-bar mode="determinate" value={{progress}}></mat-progress-bar> -->
  <!-- <br /> -->
</span>
