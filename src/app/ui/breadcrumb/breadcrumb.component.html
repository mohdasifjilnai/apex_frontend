<!-- add breadcrumb through routing -->
<ul>
  <img src="/assets/icon/home.svg" class="mx-2" />
  <!-- <img src="/assets/icon/right-arrow.svg" class="mx-2" /> -->
  <li *ngFor="let breadcrumb of breadcrumbs$ | async">
    <img src="/assets/icon/right-arrow.svg" class="mx-2" />
    <a [routerLink]="breadcrumb.url" class="breadcrumb-title">{{
      breadcrumb.label
    }}</a>
    
  </li>
</ul>
