
<div *ngIf="isRefreshing" class="refresh-bar mt-3 mb-3">
  <mat-spinner></mat-spinner>
</div>
<div >
  <div class="header row" *ngIf="mobileApp!='true'">
    <div class="col-lg-12 col-md-12 col-sm-12">
      <app-header></app-header>
    </div>
  </div>
  <div class="main-content" >
    <app-breadcrumb class="breadcrumb"></app-breadcrumb>
    <div class="main-body p-4" (touchstart)="onTouchStart($event)" 
    (touchend)="onTouchEnd($event)">
      
      <router-outlet></router-outlet>
    </div>
  </div>
  <div class="header row pt-4" *ngIf="mobileApp!='true'">
    <div class="col-lg-12 col-md-12 col-sm-12">
      <app-footer></app-footer>
    </div>
  </div>
</div>
