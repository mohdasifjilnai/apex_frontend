<div class="quotes-dropdown">
  <div class="header">
    <div class="d-flex justify-content-between ps-4 pe-2 pt-3">
      <span class="change-text">{{ data }}</span>
      <img
        src="/assets/icon/cross.svg"
        alt=""
        class="cross-icon me-3"
        (click)="cancelChangeIDv($event)"
      />
    </div>
  </div>
  <hr />
  <div class="dropdown-list p-3" *ngIf="data == 'Addons'">
    <mat-radio-group
      aria-label="Select an option"
      (change)="sortingChange($event)"
      [value]="defaultSortSelectedValue"
    >
      <mat-radio-button value="low">Low to High</mat-radio-button>
      <hr style="border: 1px solid #d4e7ef" />
      <mat-radio-button value="high">High to Low</mat-radio-button>
    </mat-radio-group>
  </div>
  <div class="dropdown-list p-3" *ngIf="data == 'Owner Type'">
    <mat-radio-group
      aria-label="Select an option"
      (change)="changeProposalType($event)"
      [value]="defaultOwnerSelectedValue"
    >
      <mat-radio-button
        *ngFor="let proposalData of proposalList"
        [value]="proposalData.proposer_name"
        class="mb-3"
        >{{ proposalData.proposer_name | titlecase }}</mat-radio-button
      >
    </mat-radio-group>
  </div>
</div>
