<div class="add-ons">
  <mat-accordion>
    <mat-expansion-panel *ngFor="let addOns of addOnsArray">
      <mat-expansion-panel-header>
        <mat-panel-title> {{ addOns.rb_type }} </mat-panel-title>
      </mat-expansion-panel-header>
      <span *ngFor="let listValue of addOns.fe_template">
        <section class="my-2 d-grid">
          <span *ngIf="listValue.type == 'check_box'">
            <mat-checkbox
              [(ngModel)]="listValue.checked"
              (change)="onCheckboxSelect($event, listValue.name)"
              >{{ listValue?.name }}</mat-checkbox
            >

            <span
              *ngIf="listValue?.next_type == 'multi_chcekbox'"
              class="d-grid m-2"
            >
              <mat-checkbox *ngFor="let data of listValue.value">{{
                data
              }}</mat-checkbox>
            </span>
          </span>
        </section>
        <section class="my-2 d-grid">
          <ng-container>
            <mat-form-field
              appearance="outline"
              *ngIf="listValue?.next_type == 'dropdown'"
            >
              <mat-label>Select Value</mat-label>
              <mat-select>
                <mat-option
                  *ngFor="let items of listValue.value"
                  [value]="items"
                  >{{ items }}</mat-option
                >
              </mat-select>
            </mat-form-field>
          </ng-container>
        </section>

        <section
          class="my-2 d-grid"
          *ngIf="listValue?.next_type == 'int_input'"
        >
          <mat-form-field appearance="outline" class="mat-input-custom">
            <mat-label>{{ listValue?.name }}</mat-label>
            <input matInput value="100000" />
          </mat-form-field>
        </section>
      </span>
    </mat-expansion-panel>
  </mat-accordion>
