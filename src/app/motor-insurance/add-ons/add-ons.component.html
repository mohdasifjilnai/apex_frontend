<div class="add-ons my-3">
  <div class="card border rounded ">
    <div class="card-header">
      <div class="header-text">
        <span class="add-ons-header-text"> Add Ons </span>
        <span
          class="tag-right clear-all-text text-light-blue"
          (click)="clearAllChecked()"
        >
          Clear All
        </span>
      </div>
    </div>
    <div class="card-body">
      <section
        class="my-2"
        *ngFor="let listValue of addonList"
      >
        <mat-checkbox [(ngModel)]="listValue.checked">{{
          listValue?.rb_addon_name
        }}</mat-checkbox>
      </section>
    </div>
  </div>
</div>
