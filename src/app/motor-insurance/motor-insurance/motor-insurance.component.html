<div class="row main-container">
  <!-- <app-breadcrumb></app-breadcrumb> -->

  <div class="body-content">
    <div class="container">
      <div class="col-12 text-center">
        <h1 class="motor-insurance">Motor Insurance</h1>
      </div>
      <div class="col-12 text-center mt-4">
        <h2 class="vehicle-quote">
          Gear Up for Protection! Choose Your Customer's Vehicle Type
        </h2>
      </div>
      <form [formGroup]="motorInsurance">
        <div>
          <app-vehicle-type></app-vehicle-type>
        </div>
        <div class="col-12 mt-4">
            <multi-select-drop-down
              [multi_select_cities]="multi_select_cities"
            ></multi-select-drop-down>
          </div>
        <div class="col-12 mt-4" *ngIf="!withoutVehicleNumber">
          <div class="d-flex justify-content-center">
            <app-registration-number
              [required]="true"
            ></app-registration-number>
          </div>
        </div>
        <!-- Fields Without Vehicle Number  -->
        <div *ngIf="withoutVehicleNumber" class="row mt-4">
          <div class="col-4">
            <app-vehicle [required]="true"></app-vehicle>
          </div>
          <div class="col-4">
            <app-rto></app-rto>
          </div>
          <div class="col-4">
            <app-rto [cities]="cities"></app-rto>
          </div>
          <div class="col-4">
            <app-vehicle [required]="true"></app-vehicle>
          </div>
          <div class="col-4">
            <app-rto></app-rto>
          </div>
          <div class="col-4">
            <app-rto></app-rto>
          </div>
        </div>
        <div
          class="col-12 text-center"
          [ngClass]="{ 'vehicle-submitted': withoutVehicleNumber }"
        >
          <button
            class="submit-btn vehicle-submission"
            type="submit"
            (click)="getVehicleDetails()"
          >
            Get Vehicle Details
          </button>
        </div>
        <div class="col-12 text-center">
          <a>
            <p
              class="text-primary mb-3 mt-4 without-vehicle-no cursor-pointer"
              (click)="getVehicleNumber()"
            >
              Proceed without Vehicle Number
            </p>
          </a>
        </div>
      </form>
    </div>
  </div>
</div>
