<div class="idv-range">
  <div class="card my-2">
    <div class="main-card-body">
      <div class="card-body">
        <div class="range-flex">
          <div class="small-amount-value tag-text">Choose IDV</div>
          <div class="small-amount-value text-orange amount-format-text">
            {{ currentAmount | amountFormat }}
          </div>
        </div>
        <mat-slider
          class="custom-slider"
          #event
          min="100000"
          max="700000"
          step="100000"
          value="{{ investedAmount }}"
          (input)="onSliderRangeAmount($event)"
          aria-readonly="true"
        ></mat-slider>
        <div class="range-flex">
          <div class="small-amount-value">&#8377; 1,00,000</div>
          <div class="small-amount-value">&#8377; 7,00,000</div>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="idv-range-res">
  <div class="changeIdv-card">
    <div class="header">
      <div class="d-flex justify-content-between ps-4 pe-4 pt-4">
        <span class="change-text">Change IDV</span>
        <img src="/assets/icon/cross.svg" alt="" class="cross-icon me-3" (click)="cancelChangeIDv($event)"/>
      </div>

    </div>
    <hr>
    <div class="main-card-body  m-2">
      
      <div class="card-body">
        <div class="range-flex">
          <div class="small-amount-value tag-text">Choose IDV</div>
          <div class="small-amount-value text-orange amount-format-text">
            {{ currentAmount | amountFormat }}
          </div>
        </div>
        <mat-slider
          class="custom-slider"
          #event
          min="100000"
          max="700000"
          step="1000"
          value="{{ investedAmount }}"
          (input)="onSliderRangeAmount($event)"
          aria-readonly="true"
        ></mat-slider>
        <div class="range-flex">
          <div class="small-amount-value">&#8377; 4,98,500</div>
          <div class="small-amount-value">&#8377; 7,00,000</div>
        </div>
      </div>
    </div>
    <div class="btns d-flex p-3">
      <button   class="cancel-btn col-6" (click)="cancelChangeIDv($event)">Cancel</button>
      <button   class="submit-btn col-6">Change</button>
    </div>
  </div>
</div>
