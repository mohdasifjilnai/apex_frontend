<div class="row m-4 proposal-page">
  <div class="col-lg-3 col-md-4">
    <app-insurance-details></app-insurance-details>
  </div>
  <div class="col-lg-9 col-md-8">
    <mat-accordion multi="false">
      <mat-expansion-panel
        (opened)="loadCkyc('ckyc')"
        id-automation="ckyc_details"
      >
        <mat-expansion-panel-header>
          <mat-panel-title> CKYC </mat-panel-title>
        </mat-expansion-panel-header>
        <app-ckyc
          *ngIf="isCkycLoaded"
          (afterProceedGetData)="getProceedData($event)"
        ></app-ckyc>
      </mat-expansion-panel>
      <mat-expansion-panel
        (opened)="loadCkyc('Vehicle Owner Details')"
        #vehilceOwnerPanel
        id-automation="vehilce_owner"
      >
        <mat-expansion-panel-header>
          <mat-panel-title> Vehicle Owner Details </mat-panel-title>
        </mat-expansion-panel-header>
        <app-vehicle-owner-details
          *ngIf="showVehicleOwnerDetails"
          [fetchCkycData]="proceedData"
          (afterVehicleOwnerData)="getVehicleOwnerData($event)"
        ></app-vehicle-owner-details>
      </mat-expansion-panel>
      <mat-expansion-panel
        (opened)="loadCkyc('Nominee Details')"
        #nomineDetailsPanel
        id-automation="nomine_details"
      >
        <mat-expansion-panel-header>
          <mat-panel-title> Nominee Details </mat-panel-title>
        </mat-expansion-panel-header>
        <app-nominee-details
          *ngIf="showNomineeDetails"
          [fetchOwnerVehicleDetails]="proceedData"
          (afterNomineeGetData)="getNomineeData($event)"
        ></app-nominee-details>
      </mat-expansion-panel>
      <mat-expansion-panel
        (opened)="loadCkyc('Vehicle Details')"
        #vehicleDetailPanel
        id-automation="vehicle_details"
      >
        <mat-expansion-panel-header>
          <mat-panel-title> Vehicle Details </mat-panel-title>
        </mat-expansion-panel-header>
        <app-proposal-vehicle-details
          *ngIf="showVehicleDetails"
          [fetchNomineeDetails]="proceedData"
          (afterVehicleData)="getVehicleData($event)"
        ></app-proposal-vehicle-details>
      </mat-expansion-panel>
      <mat-expansion-panel
        (opened)="loadCkyc('Previous Policy Details')"
        #previousPolicyDetailsPanel
        id-automation="previous_policy_details"
      >
        <mat-expansion-panel-header>
          <mat-panel-title> Previous Policy Details </mat-panel-title>
        </mat-expansion-panel-header>
        <app-previous-policy-details
          *ngIf="showPreviousPolicyDetails"
          [fetchVehicleDetails]="proceedData"
        ></app-previous-policy-details>
      </mat-expansion-panel>
    </mat-accordion>
  </div>
</div>
<div class="res-proposal-page p-2">
  <div class="back-button mb-2" (click)="back()">
    <img src="/assets/icon/back.png" alt="" class="back-image me-2" />Proposal
  </div>
  <div>
    <app-vehicle-details-card></app-vehicle-details-card>
  </div>
  <div>
    <app-insurance-details></app-insurance-details>
  </div>
  <div class="stepper p-2 mt-3">
    <div class="ckyc" *ngIf="step1">
      <div class="row">
        <div class="col-2">
          <img src="/assets/icon/step-1.svg" alt="" class="step-icon" />
        </div>
        <div class="col-10">
          <div class="d-grid">
            <span class="step-text">Step 1/5</span>
            <span class="step-header-text">CKYC Details</span>
            <img src="/assets/icon/stepper-1.svg" alt="" class="stepper-icon" />
          </div>
        </div>
      </div>
      <hr />
      <div class="row mb-5">
        <app-ckyc (afterProceedGetData)="getProceedData($event)"></app-ckyc>
      </div>
    </div>
    <div class="Vehicle-Owner-Details" *ngIf="step2">
      <div class="row">
        <div class="col-2">
          <img src="/assets/icon/step-2.svg" alt="" class="step-icon" />
        </div>
        <div class="col-10">
          <div class="d-grid">
            <span class="step-text">Step 2/5</span>
            <span class="step-header-text">Vehicle Owner Details</span>
            <img src="/assets/icon/stepper-2.svg" alt="" class="stepper-icon" />
          </div>
        </div>
      </div>
      <hr />
      <div class="row mb-5">
        <app-vehicle-owner-details
          (afterVehicleOwnerData)="vehicleOwnerDetailsData($event)"
        ></app-vehicle-owner-details>
      </div>
    </div>
    <div class="Nominee-Details" *ngIf="step3">
      <div class="row">
        <div class="col-2">
          <img src="/assets/icon/step-3.svg" alt="" class="step-icon" />
        </div>
        <div class="col-10">
          <div class="d-grid">
            <span class="step-text">Step 3/5</span>
            <span class="step-header-text">Nominee Details</span>
            <img src="/assets/icon/stepper-3.svg" alt="" class="stepper-icon" />
          </div>
        </div>
      </div>
      <hr />
      <div class="row mb-5">
        <app-nominee-details
          (afterNomineeGetData)="nomineeDetailsData($event)"
        ></app-nominee-details>
      </div>
    </div>
    <div class="Vehicle-Details" *ngIf="step4">
      <div class="row">
        <div class="col-2">
          <img src="/assets/icon/step-4.svg" alt="" class="step-icon" />
        </div>
        <div class="col-10">
          <div class="d-grid">
            <span class="step-text">Step 4/5</span>
            <span class="step-header-text">Vehicle Details</span>
            <img src="/assets/icon/stepper-4.svg" alt="" class="stepper-icon" />
          </div>
        </div>
      </div>
      <hr />
      <div class="row mb-5">
        <app-proposal-vehicle-details
          (afterVehicleData)="proposerVehicleDetailsData($event)"
        ></app-proposal-vehicle-details>
      </div>
    </div>
    <div class="Previous Policy Details" *ngIf="step5">
      <div class="row">
        <div class="col-2">
          <img src="/assets/icon/step-5.svg" alt="" class="step-icon" />
        </div>
        <div class="col-10">
          <div class="d-grid">
            <span class="step-text">Step 5/5</span>
            <span class="step-header-text">Previous Policy Details</span>
            <img src="/assets/icon/stepper-5.svg" alt="" class="stepper-icon" />
          </div>
        </div>
      </div>
      <hr />
      <div class="row mb-5">
        <app-previous-policy-details></app-previous-policy-details>
      </div>
    </div>
  </div>
</div>
