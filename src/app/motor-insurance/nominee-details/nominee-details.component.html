<form [formGroup]="nominneForm" (ngSubmit)="getNomineeDetails(nominneForm.value)">
  <div class="row mt-3">
    <div class="col-lg-4 col-md-4 col-12">
      <app-owner-full-name
        [required]="true"
        [formControlNameData]="'nominne_full_Name'"
        [label]="'Nominee Full Name'"
      ></app-owner-full-name>
    </div>
    <div class="col-lg-4 col-md-4 col-12">
      <mat-form-field appearance="outline" class="date-of-birth">
        <mat-label>Select Date of Birth</mat-label>
        <input
          matInput
          [matDatepicker]="dateOfBirth"
          placeholder="Date of Birth"
          formControlName="date_of_birth"
          appDateFormat
          [min]="minDate"
          [max]="maxDate"
        />
        <mat-datepicker-toggle
          matSuffix
          [for]="dateOfBirth"
        ></mat-datepicker-toggle>
        <mat-datepicker #dateOfBirth> </mat-datepicker>
      </mat-form-field>
    </div>
    <div class="col-lg-4 col-md-4 col-12">
      <mat-form-field appearance="outline" class="mat-input-custom">
        <mat-label>Select Relationship</mat-label>
        <mat-select formControlName="nominne_relation">
          <mat-option
            *ngFor="let relation of relationshipList"
            [value]="relation?.id"
          >
            {{ relation?.relationName }}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>
  </div>
  <div class="row">
    <div class="col-lg-4 col-md-4 col-12">
      <button class="submit-btn owner-vehicle-submission" type="submit">
        Save & Continue
      </button>
    </div>
    
  </div>
</form>
