<!-- Dialog title -->
<div mat-dialog-title>
  <div class="row mt-3">
    <div class="col-lg-6 col-md-6 col-11">
      <img src="/assets/icon/otp.svg" class="otp-image" alt="close" />
    </div>
    <div class="col-1 cross-btn">
      <img
        src="/assets/icon/cross.svg"
        class="cursor-pointer"
        alt="close"
        (click)="onClose()"
      />
    </div>

    <div class="col-lg-6 col-md-6 col-12">
      <div>
        <span class="enter-otp">
          Enter <span class="otp">OTP</span> generated on 9876543210 and
          shivam@gmail.com
        </span>
      </div>
      <div mat-dialog-content>
        <div>
          <span class="otp-header asterik-mandtry">OTP</span>
        </div>
        <div class="row">
          <div class="col-lg-12 col-12 col-md-12">
            <ng-otp-input
              #ngOtpInput
              (onInputChange)="onOtpChange($event)"
              [config]="config"
              class="custom-otp-input"
            ></ng-otp-input>
          </div>
          <div class="col-lg-12 col-12 resend-otp-msg text-end">
            <div class="">
              <div *ngIf="resendDisabled" (click)="resendOtp()">
                <span class="expire">
                  Resend
                  <ng-container *ngIf="resendDisabled">
                    in <span class="otp-count">{{ countdown }}</span> seconds
                  </ng-container>
                  <ng-container *ngIf="!resendDisabled && countdown <= 0">
                    OTP
                  </ng-container>
                </span>
              </div>
            </div>
            <a
              *ngIf="!resendDisabled && countdown <= 0"
              class="disabled-resent-otp mt-1"
            >
              Resend OTP
            </a>
          </div>
          <div class="col-12 mt-3">
            <button class="submit-btn otp-submission" type="submit">
              Verify & Proceed
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
