<!-- Dialog title -->
<div mat-dialog-title>
  <div class="row mt-3">
    <div class="col-6">
      <img src="/assets/icon/otp.svg" class="cursor-pointer" alt="close" />
    </div>
    <div class="col-6">
      <div>
        <p class="enter-otp">
          Enter <span class="text-warning">OTP</span> generated on 9876543210
          and shivam@gmail.com
        </p>
      </div>
      <div mat-dialog-content>
        <div>
          <span class="otp-header">OTP<span class="text-danger">*</span></span>
        </div>
        <div class="row">
          <div class="col-lg-12 col-sm-12 col-md-12">
            <ng-otp-input
              #ngOtpInput
              (onInputChange)="onOtpChange($event)"
              [config]="config"
              class="custom-otp-input"
            ></ng-otp-input>
          </div>
        </div>
        <div class="row mt-2">
          <div class="col-lg-12 resend-otp-msg text-center">
            <div class="d-flex justify-content-end">
              <a
                *ngIf="resendDisabled"
                class="disabled-resent-otp"
                (click)="resendOtp()"
              >
                <span class="expire">
                  Resend
                  <ng-container *ngIf="resendDisabled">
                    in <span class="text-warning">{{ countdown }}</span> seconds
                  </ng-container>
                  <ng-container *ngIf="!resendDisabled && countdown <= 0">
                    OTP
                  </ng-container>
                </span>
              </a>
            </div>
            <div
              *ngIf="!resendDisabled && countdown <= 0"
              class="disabled-resent-otp"
            >
              Resend OTP is available now.
            </div>
          </div>
          <div class="col-12 mt-3">
            <button
              class="submit-btn otp-submission"
              type="submit"            >
              Verify & Proceed
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
