<!-- Dialog title -->
<form [formGroup]="shareQuotationForm">
  <!-- Dialog content -->
  <div mat-dialog-content class="mt-2">
    <div class="d-flex justify-content-between">
      <div class="plans-name">
        <div class="header-share-text">Share selected quotes</div>
        <div *ngFor="let value of data?.data">
          <span class="header-sub-text">{{ value?.insurer_name }}, </span>
        </div>
      </div>
      <div class="cross">
        <img
          src="/assets/icon/cross.svg"
          (click)="onClose()"
          class="cursor-pointer"
          alt="close"
        />
      </div>
    </div>
    <div class="row mt-2">
      <!-- <div class="col-12">
        <mat-form-field
          appearance="outline"
          class="mat-input-share-social-media"
        >
          <mat-label>Enter WhatsApp Number</mat-label>
          <input
            matInput
            aria-label="whatsApp_number"
            placeholder="Enter WhatsApp Number"
            formControlName="whatsApp_number"
            maxlength="10"
          />
          <button class="social-media-image" (click)="shareQuotes()" >
            <img
            src="/assets/icon/whatsapp.svg"
            class=" whatsapp-image"
            alt="close"
          />
          </button>
        </mat-form-field>
      </div> -->
      <div class="col-12">
        <mat-form-field
          appearance="outline"
          class="mat-input-share-social-media"
        >
          <mat-label>Enter Contact Number</mat-label>
          <input
            matInput
            aria-label="contact_number"
            placeholder="Enter Contact Number"
            formControlName="contact_number"
            maxlength="10"
          />
          <button
            class="social-media-image"
            (click)="shareQuotes()"
            [disabled]="shareQuotationForm.invalid"
          >
            <img
              src="/assets/icon/sms.svg"
              class="whatsapp-image"
              alt="close"
            />
          </button>
        </mat-form-field>
      </div>
      <div class="col-12">
        <mat-form-field
          appearance="outline"
          class="mat-input-share-social-media"
        >
          <mat-label>Enter Email</mat-label>
          <input
            matInput
            aria-label="email"
            placeholder="Enter Email"
            formControlName="email"
          />
          <button
            class="social-media-image"
            type="submit"
            (click)="shareQuotes()"
            [disabled]="shareQuotationForm.invalid"
          >
            <img
              src="/assets/icon/mail.svg"
              class="whatsapp-image"
              alt="close"
            />
          </button>
        </mat-form-field>
      </div>
    </div>
  </div>
</form>
