<mat-form-field class="mat-input-custom" appearance="outline">
  <mat-label>City</mat-label>
  <input
    matInput
    placeholder="city"
    aria-label="city"
    #autoCompleteInput
    [matAutocomplete]="cityAuto"
    [formControlName]="formControlName"
  />
  <mat-autocomplete #cityAuto="matAutocomplete">
    <mat-option
      *ngFor="let city of filteredCityList | async"
      [value]="city.display_name"
    >
      <span>{{ city.display_name }}</span>
    </mat-option>
  </mat-autocomplete>
</mat-form-field>
