<mat-form-field class="drop-down-fields" appearance="outline">
  <mat-label>Search RTO/City</mat-label>
  <input
    matInput
    id-automation="rtoData"
    placeholder="Search RTO/City"
    aria-label="rto_city"
    (ngModelChange)="rtoBlankData($event)"
    #autoCompleteInput
    [matAutocomplete]="autoRTO"
    formControlName="rto_city"
    appAlphaNumeric
  />
  <mat-autocomplete
    #autoRTO="matAutocomplete"
    [displayWith]="displayRto.bind(this)"
  >
    <ng-container *ngIf="rtoDataLength > 1">
      <span *ngIf="rtoDataNotAvailable == ''">
        <mat-option
          *ngFor="let rto of filteredRtoList | async"
          [value]="rto"
          id-automation="searchRtoDropdown"
        >
          <span>{{ rto.display_name }}</span>
        </mat-option>
      </span>
      <span *ngIf="rtoDataNotAvailable">
        <mat-option *ngFor="let rto of filteredRtoList | async" [value]="rto">
          <span>{{ rto }}</span>
        </mat-option>
      </span>
    </ng-container>
  </mat-autocomplete>
</mat-form-field>
