<mat-form-field appearance="outline" [class]="customManufactureDate">
  <mat-label>Manufacture Date</mat-label>
  <input
    matInput
    [matDatepicker]="manufactureDate"
    placeholder="Manufacture Date"
    formControlName="manufacture_date"
    id-automation="manufacture_date"
    appMmYyyyformat
    [min]="minDate"
    [max]="maxDate"
    [max]="maxManufactureDate"
    [readonly]="true"
    [ngClass]="{
      isManufactureData: isManufactureDateDisbaled
    }"
  />
  <mat-datepicker-toggle
    matSuffix
    [for]="manufactureDate"
  ></mat-datepicker-toggle>
  <mat-datepicker
    #manufactureDate
    startView="multi-year"
    id-automation="datepicker_manufacture_date"
    (yearSelected)="chosenYearManufacture($event)"
    (monthSelected)="chosenMonthManufacture($event, manufactureDate)"
  >
  </mat-datepicker>
  <mat-error *ngIf="form.controls['manufacture_date']?.hasError('required')">
    This is a required field.
  </mat-error>
</mat-form-field>
