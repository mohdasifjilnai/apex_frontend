<mat-form-field appearance="outline" class="text-area h-100 w-100">
  <mat-label class="registration-address"
    >Vehicle Registration Address</mat-label
  >
  <input
    matInput
    placeholder="Enter Address"
    formControlName="vehicle_registration_addres"
  />
  <mat-error
    *ngIf="
      vehilceRegistrationForm.controls['vehicle_registration_addres']?.hasError(
        'required'
      )
    "
    class="ms-4"
  >
    Invalid Address
  </mat-error>
  <mat-error
    *ngIf="
      vehilceRegistrationForm.controls['vehicle_registration_addres']?.hasError(
        'pattern'
      )
    "
    class="ms-4"
  >
    Invalid Address
  </mat-error>
</mat-form-field>
