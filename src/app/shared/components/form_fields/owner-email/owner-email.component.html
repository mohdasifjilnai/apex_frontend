<mat-form-field appearance="outline" class="mat-input-custom">
  <mat-label>Email</mat-label>
  <input matInput placeholder="Enter Email" formControlName="owner_email" />
  <mat-error
    *ngIf="form.controls['owner_email']?.hasError('required')"
    class="ms-4"
  >
    This is a required field.
  </mat-error>
  <mat-error
    *ngIf="form.controls['owner_email']?.hasError('pattern')"
    class="ms-4"
  >
    Invalid email
  </mat-error>
</mat-form-field>
