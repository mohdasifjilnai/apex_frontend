   <mat-form-field class="previous-insurer" appearance="outline">
    <mat-label>Search Previous Insurer</mat-label>
    <input matInput placeholder="Search Previous Insurer" aria-label="previous_insurer" #autoCompleteInput [matAutocomplete]="auto" formControlName="previous_insurer">
    <mat-autocomplete #auto="matAutocomplete" >
      <mat-option *ngFor="let insurer of filteredInsurerList | async" [value]="insurer.rb_insurer_name">
        <span>{{ insurer.rb_insurer_name }}</span> 
      </mat-option>
    </mat-autocomplete>
  </mat-form-field>
