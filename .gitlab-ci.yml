stages:
    - build
    - deploy

build:
  stage: build
  image: docker:latest
  services:
    - name: docker:dind
  before_script:
    - docker login -u gitlab-ci-token -p $CI_BUILD_TOKEN $CI_REGISTRY    
  script:
    - DOCKER_BUILDKIT=0 docker build -t $CI_REGISTRY_IMAGE:$(date +%Y.%m.%d.%H) .
    - docker push $CI_REGISTRY_IMAGE:$(date +%Y.%m.%d.%H)
    - docker tag $CI_REGISTRY_IMAGE:$(date +%Y.%m.%d.%H) $CI_REGISTRY_IMAGE:latest
    - docker push $CI_REGISTRY_IMAGE:latest

  only:
    - master


deploy:
  stage: deploy   
  script:
    - chmod 400 -v ${DEV_SERVER_KEY} 
    - echo ${DEV_SERVER_KEY}
    - scp -o StrictHostKeyChecking=no -i ${DEV_SERVER_KEY} deploy.sh docker-compose.yml ubuntu@${DEV_SERVER_IP}://home/ubuntu/repos/apex-frontend
    - ssh -o stricthostkeychecking=no -i ${DEV_SERVER_KEY} ubuntu@${DEV_SERVER_IP} "sudo su - ubuntu; cd repos/apex-frontend; sh deploy.sh"

  only:
    - master
